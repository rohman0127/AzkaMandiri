name: Auto Deploy to InfinityFree

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-infinityfree
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to InfinityFree
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, gd, zip, bcmath
          coverage: none

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🎨 Install NPM & Build Vite Assets
        run: |
          npm ci || npm install
          npm run build

      - name: 📦 Package Application Deployment Archives
        run: |
          # 1. Prepare Root index.php with safe try-catch auto-extractor
          cat << 'EOF' > index.php
          <?php
          try {
              $zips = ['core.zip', 'public.zip', 'vendor_addons.zip', 'vendor.zip'];
              $needsExtract = false;
              foreach ($zips as $z) {
                  if (file_exists(__DIR__ . '/' . $z)) {
                      $needsExtract = true;
                      break;
                  }
              }
              if ($needsExtract && class_exists('ZipArchive')) {
                  @set_time_limit(300);
                  foreach ($zips as $z) {
                      $zipPath = __DIR__ . '/' . $z;
                      if (file_exists($zipPath)) {
                          $zip = new ZipArchive();
                          if ($zip->open($zipPath) === true) {
                              $zip->extractTo(__DIR__);
                              $zip->close();
                              @unlink($zipPath);
                          }
                      }
                  }
                  // Remove stale bootstrap caches
                  @unlink(__DIR__ . '/bootstrap/cache/config.php');
                  @unlink(__DIR__ . '/bootstrap/cache/routes-v7.php');
                  @unlink(__DIR__ . '/bootstrap/cache/services.php');
                  @unlink(__DIR__ . '/bootstrap/cache/packages.php');
              }
          } catch (\Throwable $e) {
              error_log("Deploy extract notice: " . $e->getMessage());
          }

          require __DIR__ . '/public/index.php';
          EOF

          # 2. Prepare Root .htaccess
          cat << 'EOF' > .htaccess
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /

              # Prevent internal rewrite loop
              RewriteCond %{ENV:REDIRECT_STATUS} ^$
              RewriteRule ^$ public/index.php [L]

              # Send all non-public requests to public/ folder
              RewriteCond %{ENV:REDIRECT_STATUS} ^$
              RewriteCond %{REQUEST_URI} !^/public/
              RewriteRule ^(.*)$ public/$1 [L]
          </IfModule>
          EOF

          # 3. Create core.zip (Laravel core code without vendor, node_modules, or stale cache)
          zip -r -q core.zip app bootstrap config database resources routes artisan composer.json composer.lock -x "bootstrap/cache/*.php"

          # 4. Create public.zip (compiled Vite build assets, public icons, images - excluding storage)
          zip -r -q public.zip public/ -x "public/storage/*"

          echo "Deployment packages successfully created:"
          ls -lh core.zip public.zip index.php .htaccess

      - name: 🚀 Upload Packages to InfinityFree via FTP
        run: |
          FTP_SERVER="${{ secrets.FTP_SERVER != '' && secrets.FTP_SERVER || 'ftpupload.net' }}"
          FTP_USER="${{ secrets.FTP_USERNAME != '' && secrets.FTP_USERNAME || 'if0_42986792' }}"
          FTP_PASS="${{ secrets.FTP_PASSWORD != '' && secrets.FTP_PASSWORD || 'bO9CcHQMU0fgG' }}"
          REMOTE_BASE="ftp://$FTP_SERVER/azkamandiri.nichesite.org/htdocs"

          echo "🚀 Uploading deployment packages to InfinityFree..."
          
          # Upload core.zip
          echo "Uploading core.zip..."
          curl -s --ftp-pasv -T core.zip -u "$FTP_USER:$FTP_PASS" "$REMOTE_BASE/core.zip"
          
          # Upload public.zip
          echo "Uploading public.zip..."
          curl -s --ftp-pasv -T public.zip -u "$FTP_USER:$FTP_PASS" "$REMOTE_BASE/public.zip"
          
          # Upload index.php
          echo "Uploading index.php..."
          curl -s --ftp-pasv -T index.php -u "$FTP_USER:$FTP_PASS" "$REMOTE_BASE/index.php"

          # Upload .htaccess
          echo "Uploading .htaccess..."
          curl -s --ftp-pasv -T .htaccess -u "$FTP_USER:$FTP_PASS" "$REMOTE_BASE/.htaccess"

          echo "✅ All packages deployed successfully to InfinityFree!"

      - name: 🌐 Ping Server to Trigger Unpack
        run: |
          echo "Triggering application unpack on InfinityFree..."
          curl -s -m 10 "http://azkamandiri.nichesite.org/" || true
          echo "Deployment complete!"
