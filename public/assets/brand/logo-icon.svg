<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer Aluminum Frame -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#172B4D" stroke="#D6A84F" stroke-width="3"/>
  <!-- Glass Panes -->
  <!-- Pane 1: Top-Left -->
  <rect x="8" y="8" width="21" height="21" rx="4" fill="#F0F4F8" fill-opacity="0.85"/>
  <path d="M9 9 L28 28" stroke="#D6A84F" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Pane 2: Top-Right -->
  <rect x="35" y="8" width="21" height="21" rx="4" fill="#D6A84F" fill-opacity="0.35"/>
  <path d="M36 9 L55 28" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Pane 3: Bottom-Left -->
  <rect x="8" y="35" width="21" height="21" rx="4" fill="#D6A84F" fill-opacity="0.35"/>
  <path d="M9 36 L28 55" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Pane 4: Bottom-Right with Deep Navy Finish -->
  <rect x="35" y="35" width="21" height="21" rx="4" fill="#101D33"/>
  <!-- Internal Aluminum Mullions -->
  <line x1="32" y1="2" x2="32" y2="62" stroke="#D6A84F" stroke-width="3"/>
  <line x1="2" y1="32" x2="62" y2="32" stroke="#D6A84F" stroke-width="3"/>
  <!-- Center Rivet / Joint Node -->
  <circle cx="32" cy="32" r="3.5" fill="#D6A84F"/>
</svg>

